<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Dasar js</title>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
<body>
    <div class="container">
        <div class="input-group mb-3">
            <input type="text" id="inputNama" onclick="tamuKehormatan()" class="form-control" placeholder="Masukkan nama anda" aria-label="Masukkan nama anda" aria-describedby="button-addon2">
            <button class="btn btn-outline-secondary" type="button" id="btnSimpan" onclick="tamuKehormatan()">Simpan</button>
        </div>
        <h1 class="animate__animated animate__hinge">Selamat datang, <span id="namaLengkap"></span> </h1>
         <button class="btn btn-outline-danger animate__animated animate__hinge" type="button"></button>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

    <script>
        let nama = "Hanifa";
        $("#namaLengkap").html(nama)
        console.log(nama);

        function tamuKehormatan() {
            let nama = $("#inputNama").val();
            $("#namaLengkap").html(nama);
        }
    </script>
</body>
</html>
